<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BharYat - Inline Search Expand Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #111827;
            --primary: #00D084;
            --text: #ffffff;
            --text-secondary: #64748B;
            --transition: 400ms cubic-bezier(.4, 0, .2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: var(--bg-primary);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .sourceq-section {
            background: var(--bg-primary);
            padding: 60px 20px;
            width: 100%;
            max-width: 1200px;
        }

        .step-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 60px;
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.85), rgba(5, 8, 22, 0.95));
            border: 1px solid rgba(101, 167, 255, 0.2);
            border-radius: 28px;
            padding: 50px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
        }

        .step-text {
            flex: 1;
            max-width: 500px;
        }

        .step-number {
            display: inline-block;
            font-size: 18px;
            font-weight: 700;
            color: var(--primary);
            background: rgba(0, 208, 132, 0.1);
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 208, 132, 0.3);
        }

        .step-text h3 {
            font-size: 38px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .step-text p {
            font-size: 17px;
            color: #aeb8c5;
            line-height: 1.6;
        }

        .step-visual {
            flex: 1;
            display: flex;
            justify-content: center;
        }

        /* Dashboard Mockup Card */
        .dashboard-mockup {
            width: 100%;
            height: 350px;
            border-radius: 20px;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Background Image blur effect */
        .dashboard-mockup img.card-bg {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: filter var(--transition), transform var(--transition);
        }

        .dashboard-mockup.search-active img.card-bg {
            filter: blur(8px) brightness(0.5);
            transform: scale(1.05);
        }

        /* Initial Green Search Icon Button */
        .floating-badge {
            position: absolute;
            width: 65px;
            height: 65px;
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: #00D084;
            top: 20px;
            left: 20px;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0, 208, 132, 0.4);
            transition: all var(--transition);
        }

        .floating-badge:hover {
            transform: scale(1.08);
            background: #00f5a0;
        }

        /* Stretchable Search Bar */
        .expandable-search-bar {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 65px;
            height: 65px;
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(0, 208, 132, 0.5);
            border-radius: 18px;
            display: flex;
            align-items: center;
            padding: 0 15px;
            z-index: 15;
            opacity: 0;
            pointer-events: none;
            transition: all var(--transition);
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .dashboard-mockup.search-active .expandable-search-bar {
            width: calc(100% - 40px);
            opacity: 1;
            pointer-events: auto;
        }

        .expandable-search-bar form {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expandable-search-bar input {
            width: 100%;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .expandable-search-bar input::placeholder {
            color: var(--text-secondary);
        }

        .search-close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
        }

        .search-close-btn:hover {
            color: #fff;
        }
    </style>
</head>

<body>

    <section class="sourceq-section">
        <div class="step-row">
            <div class="step-text">
                <span class="step-number">01</span><span>Search Faster.</span>
                <h3>Qradar</h3>
                <p>Search millions of components instantly with our AI-powered engine. Upload your BOM and let the system do the heavy lifting.</p>
            </div>
            <div class="step-visual">
                <div class="dashboard-mockup" id="mockupCard">
                    <img class="card-bg" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQrwW61DFlYi2pDaXzEnmtFLI_JWGjNCO8o7aMrxUFM6A&s=10" alt="Search Dashboard">
                    
                    <div class="floating-badge" id="searchIconBtn" title="Click to search">
                        <span style="font-size: 24px; color: #fff;">🔍</span>
                    </div>

                    <div class="expandable-search-bar" id="searchBar">
                        <form id="inlineSearchForm" onsubmit="handleInlineSearch(event)">
                            <span style="font-size: 20px;">🔍</span>
                            <input type="text" id="inlineSearchInput" placeholder="Search components..." autocomplete="off">
                            <button type="button" class="search-close-btn" id="closeSearchBtn">&times;</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        const mockupCard = document.getElementById('mockupCard');
        const searchIconBtn = document.getElementById('searchIconBtn');
        const searchBar = document.getElementById('searchBar');
        const closeSearchBtn = document.getElementById('closeSearchBtn');
        const inlineSearchInput = document.getElementById('inlineSearchInput');

        // Open search bar on clicking green icon
        searchIconBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent document click from immediately triggering
            mockupCard.classList.add('search-active');
            inlineSearchInput.focus();
        });

        // Close on clicking 'X' button
        closeSearchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            mockupCard.classList.remove('search-active');
            inlineSearchInput.value = '';
        });

        // Close when clicking anywhere else on the screen
        document.addEventListener('click', (e) => {
            if (mockupCard.classList.contains('search-active')) {
                // Check if the click is outside the search bar and icon
                if (!searchBar.contains(e.target) && !searchIconBtn.contains(e.target)) {
                    mockupCard.classList.remove('search-active');
                    inlineSearchInput.value = '';
                }
            }
        });

        // Handle form submission / navigation
        function handleInlineSearch(event) {
            event.preventDefault();
            const query = inlineSearchInput.value.trim();
            if (query) {
                window.location.href = `search-results.html?q=${encodeURIComponent(query)}`;
            }
        }
    </script>
</body>

</html>
