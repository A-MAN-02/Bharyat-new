<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SourceQ Zoom Intro Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #ffffff;
            color: #050816;
            overflow-x: hidden;
        }

        /* 1. Scrollable Section taaki scroll karne par animation chale */
        .sourceq-intro-section {
            position: relative;
            height: 300vh;
            background-color: #ffffff;
        }

        /* 2. Sticky Wrapper jo scroll ke dauran screen par locked rahega */
        .sourceq-sticky-wrapper {
            position: sticky;
            top: 0;
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* 3. Piche ka Main Website Content (Dark Theme) */
        .main-website-content {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background-color: #050816;
            color: #ffffff;
            z-index: 1;
            padding: 20px;
        }

        .main-website-content h2 {
            font-size: 3rem;
            color: #00D084;
            margin-bottom: 20px;
        }

        .main-website-content p {
            font-size: 1.2rem;
            max-width: 700px;
            line-height: 1.6;
            color: #aeb8c5;
        }

        /* 4. Q-Hole Zoom Element (Foreground Layer) */
        .q-zoom-container {
            position: absolute;
            width: 450px;
            height: 450px;
            z-index: 2;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            will-change: transform;
            transform-origin: center center;
        }

        .q-zoom-container svg {
            width: 100%;
            height: 100%;
        }

        /* 5. Next Section */
        .next-section {
            height: 100vh;
            background-color: #0f172a;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Intro Zoom Section -->
    <section class="sourceq-intro-section" id="introSection">
        <div class="sourceq-sticky-wrapper">
            
            <!-- Piche ka main content jo Q ke andar se reveal hoga -->
            <div class="main-website-content">
                <h2>SourceQ Intelligence Engine</h2>
                <p>Search faster, analyze deeper, and procure smarter with quantum AI.</p>
            </div>

            <!-- Q Shape jiska outer area colored aur inner part transparent hai -->
            <div class="q-zoom-container" id="qZoomContainer">
                <svg viewBox="0 0 1000 1000">
                    <path fill-rule="evenodd" fill="#ffffff" d="
                        M 500, 150 
                        C 330, 150 190, 290 190, 460 
                        C 190, 630 330, 770 500, 770 
                        C 580, 770 655, 740 710, 690 
                        L 830, 810 
                        L 890, 750 
                        L 770, 630 
                        C 810, 575 830, 520 830, 460 
                        C 830, 290 670, 150 500, 150 
                        Z
                        M 500, 290
                        C 595, 290 670, 365 670, 460
                        C 670, 555 595, 630 500, 630
                        C 405, 630 330, 555 330, 460
                        C 330, 365 405, 290 500, 290
                        Z" />
                </svg>
            </div>

        </div>
    </section>

    <!-- Normal Website Flow -->
    <div class="next-section">
        <p>Main Website Section Below</p>
    </div>

    <script>
        window.addEventListener('scroll', function() {
            const section = document.getElementById('introSection');
            const qContainer = document.getElementById('qZoomContainer');
            
            const rect = section.getBoundingClientRect();
            const sectionHeight = section.offsetHeight - window.innerHeight;
            
            let progress = -rect.top / sectionHeight;
            progress = Math.max(0, Math.min(1, progress));

            // Smooth scaling: 1 se start hokar 40 tak expand hoga taaki poori screen cover ho jaye
            let scaleValue = 1 + (progress * 40);
            qContainer.style.transform = `scale(${scaleValue})`;

            // Jab animation poori ho jaye toh mouse events enable karne ke liye
            if (progress >= 0.95) {
                qContainer.style.pointerEvents = 'none';
            } else {
                qContainer.style.pointerEvents = 'auto';
            }
        });
    </script>
</body>
</html>
